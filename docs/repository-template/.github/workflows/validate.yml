name: Validate PackTune repository
# Reads only: checks packtune.json, every manifest.json and the hash of every file (the same checks PackTune makes).
on:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned to the commit)
      - name: Check the repository
        shell: pwsh
        run: ./tools/Check-PackTuneRepository.ps1 -Path .
